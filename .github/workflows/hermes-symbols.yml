name: Hermes symbols crash diagnostic
on:
  push:
    branches: [verify/hermes-symbols]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
        working-directory: apps/showcase
      - run: npx expo prebuild --platform android --no-install --clean
        working-directory: apps/showcase
      - name: Build pinned Hermes with its own symbols
        timeout-minutes: 35
        run: bash scripts/hermes-symbol-build.sh
      - name: Build ordinary showcase APK
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
        working-directory: apps/showcase/android
      - name: Install diagnostic engine in a local APK only
        run: bash scripts/hermes-symbol-apk.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-engine-and-apks
          path: engine-out
          retention-days: 7
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: exact-engine-and-apks
          path: engine-out
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Bounded exact-engine reproduction
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: false
          script: bash scripts/hermes-symbol-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: symbols-crash-results
          path: smoke-out
          retention-days: 7

name: Android Timeline Trim verification
on:
  workflow_dispatch:
    inputs:
      apk_run:
        description: Run ID of a build containing this exact Timeline source
        required: true
        default: '39937689831'
permissions:
  contents: read
  actions: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk
          run-id: ${{ inputs.apk_run }}
          github-token: ${{ github.token }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Timeline gestures on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: false
          script: |
            adb install -r apk/*.apk
            bash scripts/android-timeline.sh
      - name: Fail closed on missing evidence or crashes
        if: always()
        run: python3 scripts/check-android-results.py smoke-out --require-summary timeline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timeline-results
          path: smoke-out

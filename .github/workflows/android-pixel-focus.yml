name: Android visible frames and TalkBack touch focus
on:
  push:
    branches: [verify/pixel-focus]
permissions:
  contents: read
  actions: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 8.9}
      - name: Build the small independent observation app
        run: cd verifyapp && gradle --no-daemon :app:assembleDebug
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk
          run-id: 38752568625
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Confirm stock APK provenance
        run: sha256sum apk/*.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Changed-method checks, no production edits
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: false
          script: bash scripts/android-pixel-focus.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visible-frames-and-touch-focus
          path: smoke-out
          retention-days: 7

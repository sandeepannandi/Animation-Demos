name: Hermes frame-chain single-change diagnostic
on:
  push:
    branches: [verify/hermes-framechain]
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: npm ci
        working-directory: apps/showcase
      - uses: actions/download-artifact@v4
        with:
          name: exact-engine-and-apks
          path: baseline
          run-id: 38783981887
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build same pinned engine with only upstream x86_64 frame-chain patch
        run: bash scripts/hermes-symbol-build.sh
      - name: Package against same stock showcase artifact
        run: |
          cp baseline/stock.apk engine-out/stock.apk
          bash scripts/repackage-engine.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patched-exact-engine
          path: engine-out
          retention-days: 7
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: patched-exact-engine
          path: engine-out
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: false
          script: bash scripts/hermes-symbol-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patched-framechain-results
          path: smoke-out
          retention-days: 7
